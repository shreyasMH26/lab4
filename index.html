<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenitsu Agatsuma - Demon Slayer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-gold: #f59e0b;
      --secondary-yellow: #fbbf24;
      --glow-color: rgba(245, 158, 11, 0.4);
      --bg-dark: #0a0a0c;
      --card-bg: rgba(18, 18, 24, 0.85);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(251, 191, 36, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2rem 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeIn 1s ease-out;
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: var(--secondary-yellow);
      border-radius: 9999px;
      margin-bottom: 1rem;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #fff 30%, var(--secondary-yellow) 80%, var(--primary-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 30px rgba(245, 158, 11, 0.25);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      letter-spacing: 0.02em;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      background: var(--card-bg);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 
        0 20px 40px -15px rgba(0, 0, 0, 0.8),
        0 0 30px 2px var(--glow-color);
      backdrop-filter: blur(12px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
      animation: slideUp 1s ease-out;
    }

    .container:hover {
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.9),
        0 0 45px 5px var(--glow-color);
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #000;
      cursor: zoom-in;
    }

    .image-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .image-wrapper:hover img {
      transform: scale(1.02);
    }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      background: rgba(12, 12, 16, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .image-info {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .info-item {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .info-val {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.4rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--secondary-yellow), var(--primary-gold));
      color: #000;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    footer a {
      color: var(--secondary-yellow);
      text-decoration: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { 
        opacity: 0; 
        transform: translateY(20px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }

    @media (max-width: 640px) {
      .actions-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-group {
        width: 100%;
      }
      .btn {
        flex: 1;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="badge">Thunder Breathing • First Form</div>
    <h1>Zenitsu Agatsuma</h1>
    <p class="subtitle">High Resolution Demon Slayer Wallpaper</p>
  </header>

  <main class="container">
    <div class="image-wrapper" onclick="window.open('zenitsu-agatsuma-5760x2880-23183.jpg', '_blank')">
      <img src="zenitsu-agatsuma-5760x2880-23183.jpg" alt="Zenitsu Agatsuma Wallpaper" loading="eager">
    </div>
    <div class="actions-bar">
      <div class="image-info">
        <div class="info-item">
          <span class="info-label">Resolution</span>
          <span class="info-val">5760 × 2880 (5K)</span>
        </div>
        <div class="info-item">
          <span class="info-label">Format</span>
          <span class="info-val">JPEG Image</span>
        </div>
      </div>
      <div class="btn-group">
        <a href="zenitsu-agatsuma-5760x2880-23183.jpg" target="_blank" class="btn btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>
          Full View
        </a>
        <a href="zenitsu-agatsuma-5760x2880-23183.jpg" download class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>
          Download
        </a>
      </div>
    </div>
  </main>

  <footer>
    <p>Hosted with GitHub Pages • <a href="https://github.com/shreyasMH26/zenitsu" target="_blank">View on GitHub</a></p>
  </footer>
</body>
</html>
